name: Build NavLogger APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Signing key (fixed, so new APKs install over old ones)
        run: base64 -d app/navlogger.jks.b64 > app/navlogger.jks

      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/NavLogger.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NavLogger-apk
          path: out/NavLogger.apk
